name: Hostinger Pre-built Standalone Artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/deploy/**"
      - ".github/workflows/hostinger-artifact.yml"

permissions:
  contents: read
  actions: write

jobs:
  build-artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - run: npm run deploy:hostinger

      - name: Verify pre-built (no rebuild in artifact)
        run: |
          cd deploy/hostinger
          node -e '
            const p = require("./package.json");
            if (!p.scripts.build.includes("skip")) { process.exit(1); }
            console.log("Build script is no-op for Hostinger pre-built mode");
            if (!require("fs").existsSync(".next")) { process.exit(1); }
            console.log("Pre-built .next present - no rebuild will occur on target");
          '

      - name: Package artifact
        run: |
          cd deploy/hostinger
          tar -czf ../../hostinger-deploy-artifact.tar.gz .
          ls -lh ../../hostinger-deploy-artifact.tar.gz

      - name: Upload Hostinger artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-deploy-artifact-${{ github.sha }}
          path: hostinger-deploy-artifact.tar.gz
          retention-days: 30

      - name: Summary
        run: |
          echo "## Hostinger Pre-built Standalone Artifact" >> $GITHUB_STEP_SUMMARY
          echo "Artifact is PRE-BUILT (standalone with .next and server.js)." >> $GITHUB_STEP_SUMMARY
          echo "**CRITICAL for Hostinger: Set Build command to a no-op** (e.g. `:` or `echo pre-built`)" >> $GITHUB_STEP_SUMMARY
          echo "This prevents next build from running on deployment." >> $GITHUB_STEP_SUMMARY
          echo "Startup: node server.js (preferred) or npm start" >> $GITHUB_STEP_SUMMARY
          echo "See docs/deployment/hostinger.md" >> $GITHUB_STEP_SUMMARY

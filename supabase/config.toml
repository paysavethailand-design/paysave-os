# Supabase CLI Configuration for PAYSAVE OS
# https://supabase.com/docs/guides/cli/config

[project]
id = "paysave-prod"
name = "PAYSAVE OS Production"

[api]
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://paysave.example.com"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
file_size_limit = "50MiB"

[edge_functions]
port = 54325

[analytics]
port = 54327
vector_port = 54328
enabled = true